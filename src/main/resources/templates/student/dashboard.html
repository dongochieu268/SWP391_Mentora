<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/student-sidebar :: studentSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">

                <!-- Welcome -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h4 class="card-title mb-1">Xin chào, <span th:text="${user.fullName}">Student</span>!</h4>
                        <p class="card-text text-muted mb-0">Chào mừng bạn đến với Mentora. Chọn chức năng bên dưới để bắt đầu.</p>
                    </div>
                </div>

                <!-- Điều hướng nhanh -->
                <div class="row g-3">
                    <div class="col-md-4">
                        <a th:href="@{/student/classrooms}" class="text-decoration-none">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body d-flex align-items-center gap-3 p-4">
                                    <div class="rounded-circle d-flex align-items-center justify-content-center bg-primary bg-opacity-10"
                                         style="width:56px;height:56px;flex-shrink:0;">
                                        <i class="ti ti-school fs-4 text-primary"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-semibold mb-1 text-dark">Lớp học của tôi</h6>
                                        <p class="text-muted small mb-0">Xem lớp đã tham gia hoặc nhập mã để vào lớp mới</p>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
