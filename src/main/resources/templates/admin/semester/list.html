<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý học kỳ | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}" />
</head>

<body>
<!--  Body Wrapper -->
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
     data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/admin-sidebar :: adminSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>
        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <h5 class="card-title fw-semibold mb-0">Quản lý học kỳ</h5>
                            <a class="btn btn-primary" th:href="@{/admin/semesters/new}">
                                <i class="ti ti-plus"></i> Thêm học kỳ
                            </a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Tên học kỳ</th>
                                    <th>Bắt đầu</th>
                                    <th>Kết thúc</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(semesters)}">
                                    <td colspan="6" class="text-center text-muted py-4">Chưa có học kỳ nào.</td>
                                </tr>
                                <tr th:each="semester, stat : ${semesters}">
                                    <td th:text="${stat.count}">1</td>
                                    <td th:text="${semester.name}">Học kỳ 1</td>
                                    <td th:text="${#temporals.format(semester.startDate, 'dd/MM/yyyy')}">01/09/2025</td>
                                    <td th:text="${#temporals.format(semester.endDate, 'dd/MM/yyyy')}">15/01/2026</td>
                                    <td>
                                        <span class="status-badge status-active" th:if="${semester.status == 'ACTIVE'}">ACTIVE</span>
                                        <span class="status-badge status-inactive" th:if="${semester.status == 'HIDDEN'}">HIDDEN</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="table-actions justify-content-end">
                                            <a class="table-action-btn"
                                               th:href="@{/admin/semesters/{id}/edit(id=${semester.id})}"
                                               title="Sửa học kỳ"
                                               aria-label="Sửa học kỳ">
                                                <i class="ti ti-edit"></i>
                                            </a>
                                            <form class="table-action-form" method="post"
                                                  th:action="@{/admin/semesters/{id}/delete(id=${semester.id})}"
                                                  th:onsubmit="return confirm('Xóa học kỳ này?');">
                                                <button type="submit" class="table-action-btn is-danger"
                                                        title="Xóa học kỳ"
                                                        aria-label="Xóa học kỳ">
                                                    <i class="ti ti-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>

</html>
