<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
                    <script th:fragment="builderScripts">
                        function pickType(type) {
                            const isTest = type === 'BRANCH_TEST';
                            const input = document.getElementById('nodeTypeInput');
                            if (input) input.value = type;
                            const btnLesson = document.getElementById('typeBtnLesson');
                            const btnTest = document.getElementById('typeBtnTest');
                            if (btnLesson) btnLesson.classList.toggle('selected', !isTest);
                            if (btnTest) btnTest.classList.toggle('selected', isTest);
                            const testFields = document.getElementById('addTestFields');
                            if (testFields) testFields.classList.toggle('d-none', !isTest);
                        }

                        function addOptionRow() {
                            const wrap = document.getElementById('optionRows');
                            if (!wrap) return;
                            const n = wrap.children.length;
                            const div = document.createElement('div');
                            div.className = 'input-group input-group-sm mb-1';
                            div.innerHTML =
                                '<div class="input-group-text">' +
                                '<input class="form-check-input mt-0" type="radio" name="correctOptionIndex" value="' + n + '" title="Đáp án đúng">' +
                                '</div>' +
                                '<input type="text" class="form-control" name="optionContents" placeholder="Đáp án ' + String.fromCharCode(65 + n) + '" required>';
                            wrap.appendChild(div);
                        }
                    </script>
</body>
</html>
