<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Mentora</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
  <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}"/>
</head>
<body class="admin-app">
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

  <aside th:replace="~{layout/admin-sidebar :: adminSidebar(${activePage})}"></aside>

  <div class="body-wrapper">
    <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

    <div class="body-wrapper-inner">
      <div class="container-fluid">

        <section class="admin-page-hero mb-4">
          <div>
            <span class="admin-page-eyebrow">TRUNG TÂM QUẢN TRỊ</span>
            <h2 class="fw-bold mb-1">Tổng quan hệ thống</h2>
            <p class="mb-0">Theo dõi và quản lý toàn bộ hoạt động trên Mentora.</p>
          </div>
          <div class="admin-page-hero-icon">
            <i class="ti ti-layout-dashboard"></i>
          </div>
        </section>

        <!-- Stats -->
        <div class="row g-4 mb-4">
          <div class="col-sm-6 col-lg-3">
            <div class="card admin-stat-card stat-student">
              <div class="card-body d-flex align-items-center gap-3">
                <div class="admin-stat-icon d-flex align-items-center justify-content-center">
                  <i class="ti ti-users fs-6"></i>
                </div>
                <div>
                  <h4 class="fw-semibold mb-0" th:text="${studentCount}">0</h4>
                  <p class="mb-0 text-muted">Tổng sinh viên</p>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card admin-stat-card stat-lecturer">
              <div class="card-body d-flex align-items-center gap-3">
                <div class="admin-stat-icon d-flex align-items-center justify-content-center">
                  <i class="ti ti-chalkboard fs-6"></i>
                </div>
                <div>
                  <h4 class="fw-semibold mb-0" th:text="${lecturerCount}">0</h4>
                  <p class="mb-0 text-muted">Giảng viên</p>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card admin-stat-card stat-subject">
              <div class="card-body d-flex align-items-center gap-3">
                <div class="admin-stat-icon d-flex align-items-center justify-content-center">
                  <i class="ti ti-book fs-6"></i>
                </div>
                <div>
                  <h4 class="fw-semibold mb-0" th:text="${subjectCount}">0</h4>
                  <p class="mb-0 text-muted">Môn học</p>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card admin-stat-card stat-blocked">
              <div class="card-body d-flex align-items-center gap-3">
                <div class="admin-stat-icon is-alert d-flex align-items-center justify-content-center">
                  <i class="ti ti-ban fs-6"></i>
                </div>
                <div>
                  <h4 class="fw-semibold mb-0" th:text="${bannedAccountCount}">0</h4>
                  <p class="mb-0 text-muted">TK bị cấm</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Quick links -->
        <div class="card">
          <div class="card-body">
            <h5 class="card-title fw-semibold mb-3">Thao tác nhanh</h5>
            <div class="admin-quick-grid">
              <a th:href="@{/admin/accounts}" class="btn admin-quick-action">
                <span class="admin-quick-icon"><i class="ti ti-users"></i></span>
                <span><strong>Quản lý tài khoản</strong><small>Sinh viên và giảng viên</small></span>
                <i class="ti ti-arrow-right admin-quick-arrow"></i>
              </a>
              <a th:href="@{/admin/subjects}" class="btn admin-quick-action">
                <span class="admin-quick-icon"><i class="ti ti-book"></i></span>
                <span><strong>Quản lý môn học</strong><small>Danh mục và tiên quyết</small></span>
                <i class="ti ti-arrow-right admin-quick-arrow"></i>
              </a>
              <a th:href="@{/admin/semesters}" class="btn admin-quick-action">
                <span class="admin-quick-icon"><i class="ti ti-calendar"></i></span>
                <span><strong>Quản lý học kỳ</strong><small>Thời gian và trạng thái</small></span>
                <i class="ti ti-arrow-right admin-quick-arrow"></i>
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
