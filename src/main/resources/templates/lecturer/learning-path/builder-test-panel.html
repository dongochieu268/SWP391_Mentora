<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
                    <!-- ===== PANEL SOẠN BÀI TEST (cột phải) ===== -->
                    <div th:fragment="testPanel(baseUrl)" class="col-lg-5" th:if="${panelAssessment != null}"
                         th:with="panelReturn=${baseUrl + '?testPanel=' + panelAssessment.id}">
                        <div class="card pb-test-panel">
                            <div class="card-header d-flex align-items-center justify-content-between pb-test-panel-header">
                                <div class="me-2">
                                    <strong><i class="ti ti-pencil-question me-1"></i><span th:text="${panelAssessment.title}"></span></strong>
                                    <span class="badge ms-1"
                                          th:classappend="${panelAssessment.status == 'PUBLISHED'} ? 'text-bg-success' : 'text-bg-secondary'"
                                          th:text="${panelAssessment.status}"></span>
                                </div>
                                <a th:href="@{${baseUrl}}" class="btn btn-sm btn-light border" title="Đóng panel"><i class="ti ti-x"></i></a>
                            </div>
                            <div class="card-body">

                                <!-- Meta bài test -->
                                <form th:if="${panelCanEdit}" th:action="@{/lecturer/assessments/{id}/edit(id=${panelAssessment.id})}" method="post" class="border rounded p-2 mb-3">
                                    <input type="hidden" name="subjectId" th:value="${panelAssessment.subject.id}">
                                    <input type="hidden" name="returnTo" th:value="${panelReturn}"/>
                                    <input type="hidden" name="type" th:value="${panelAssessment.type}"/>
                                    <input type="hidden" name="deliveryMode" th:value="${panelAssessment.deliveryMode}"/>
                                    <div class="row g-2 align-items-end">
                                        <div class="col-12">
                                            <label class="form-label small mb-1" for="panelTitle">Tên bài test</label>
                                            <input type="text" class="form-control form-control-sm" name="title" id="panelTitle"
                                                   th:value="${panelAssessment.title}" maxlength="200" required>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small mb-1" for="panelDuration">Phút</label>
                                            <input type="number" class="form-control form-control-sm" name="durationMinutes" id="panelDuration"
                                                   th:value="${panelAssessment.durationMinutes}" min="1" required>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small mb-1" for="panelTotalScore">Tổng điểm</label>
                                            <input type="number" class="form-control form-control-sm" name="totalScore" id="panelTotalScore"
                                                   th:value="${panelAssessment.totalScore}" min="0.5" step="0.5" required>
                                        </div>
                                        <div class="col-4">
                                            <button type="submit" class="btn btn-sm btn-outline-primary w-100">Lưu</button>
                                        </div>
                                    </div>
                                </form>
                                <div th:unless="${panelCanEdit}" class="small text-muted mb-3">
                                    ⏱ <span th:text="${panelAssessment.durationMinutes}"></span> phút ·
                                    🎯 Tổng điểm: <span th:text="${panelAssessment.totalScore}"></span> ·
                                    Bài test đã publish — chỉ xem.
                                </div>

                                <!-- Danh sách câu hỏi -->
                                <div th:if="${#lists.isEmpty(panelQuestions)}" class="text-muted small text-center py-2">
                                    Chưa có câu hỏi nào.
                                </div>
                                <div class="card pb-q-item mb-2" th:each="q, qstat : ${panelQuestions}">
                                    <div class="card-body py-2 px-3">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <strong class="small">
                                                Câu <span th:text="${qstat.count}"></span> ·
                                                <span th:text="${q.score}"></span> điểm
                                            </strong>
                                            <form th:if="${panelCanEdit}"
                                                  th:action="@{/lecturer/assessments/{id}/questions/{qid}/delete(id=${panelAssessment.id},qid=${q.id})}"
                                                  method="post" onsubmit="return confirm('Xóa câu hỏi này?');">
                                                <input type="hidden" name="returnTo" th:value="${panelReturn}"/>
                                                <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-1"><i class="ti ti-trash"></i></button>
                                            </form>
                                        </div>
                                        <p class="small mb-1" th:text="${q.content}"></p>
                                        <ul class="small mb-0 list-unstyled ms-2">
                                            <li th:each="opt : ${panelOptions[q.id]}">
                                                <i th:class="${opt.correct} ? 'ti ti-circle-check text-success me-1' : 'ti ti-circle text-muted me-1'"></i>
                                                <span th:text="${opt.content}"></span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>

                                <!-- Form thêm câu hỏi -->
                                <form th:if="${panelCanEdit}"
                                      th:action="@{/lecturer/assessments/{id}/questions(id=${panelAssessment.id})}"
                                      method="post" class="inline-form-panel p-3 mb-3">
                                    <input type="hidden" name="returnTo" th:value="${panelReturn}"/>
                                    <input type="hidden" name="questionType" value="MULTIPLE_CHOICE"/>
                                    <strong class="small d-block mb-2"><i class="ti ti-plus me-1"></i>Thêm câu hỏi mới</strong>
                                    <textarea class="form-control form-control-sm mb-2" name="content" rows="2"
                                              placeholder="Nội dung câu hỏi..." required></textarea>
                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <select class="form-select form-select-sm" name="difficulty">
                                                <option th:each="d : ${difficultyOptions}" th:value="${d}" th:text="${d}"></option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <input type="number" class="form-control form-control-sm" name="score"
                                                   value="1" min="0.25" step="0.25" placeholder="Điểm" required>
                                        </div>
                                    </div>
                                    <div id="optionRows">
                                        <div class="input-group input-group-sm mb-1">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctOptionIndex" value="0" checked title="Đáp án đúng">
                                            </div>
                                            <input type="text" class="form-control" name="optionContents" placeholder="Đáp án A" required>
                                        </div>
                                        <div class="input-group input-group-sm mb-1">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctOptionIndex" value="1" title="Đáp án đúng">
                                            </div>
                                            <input type="text" class="form-control" name="optionContents" placeholder="Đáp án B" required>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-light border w-100 mb-2" onclick="addOptionRow()">
                                        <i class="ti ti-plus me-1"></i>Thêm đáp án
                                    </button>
                                    <button type="submit" class="btn btn-sm btn-primary w-100">
                                        <i class="ti ti-device-floppy me-1"></i>Lưu câu hỏi
                                    </button>
                                </form>

                                <!-- Tổng điểm + Publish -->
                                <th:block th:if="${panelCanEdit}" th:with="scoreMatch=${panelScoreSum.compareTo(panelAssessment.totalScore) == 0}">
                                    <div class="alert py-2 small mb-2"
                                         th:classappend="${scoreMatch} ? 'alert-success' : 'alert-warning'">
                                        <i th:class="${scoreMatch} ? 'ti ti-check me-1' : 'ti ti-alert-triangle me-1'"></i>
                                        Tổng điểm câu hỏi: <strong th:text="${panelScoreSum}"></strong> /
                                        <span th:text="${panelAssessment.totalScore}"></span>
                                        <span th:unless="${scoreMatch}"> — cần khớp tổng điểm trước khi publish.</span>
                                    </div>
                                    <form th:action="@{/lecturer/assessments/{id}/publish(id=${panelAssessment.id})}" method="post"
                                          onsubmit="return confirm('Publish bài test? Sau khi publish sẽ không sửa được nữa.');">
                                        <input type="hidden" name="returnTo" th:value="${panelReturn}"/>
                                        <button type="submit" class="btn btn-success w-100">
                                            <i class="ti ti-send me-1"></i>Publish bài test
                                        </button>
                                    </form>
                                    <div class="form-text text-center mt-1">Sau khi publish, bài test sẵn sàng cho sinh viên và không sửa được nữa.</div>
                                </th:block>
                            </div>
                        </div>
                    </div>
</body>
</html>
