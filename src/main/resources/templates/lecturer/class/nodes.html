<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý node lớp học | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h5 class="fw-semibold mb-1" th:text="${classroom.name}"></h5>
                        <p class="text-muted small mb-0">
                            Môn: <span th:text="${classroom.subject.code + ' — ' + classroom.subject.name}"></span>
                            &nbsp;|&nbsp; Lộ trình: <span th:text="${classroom.learningPath.name}"></span>
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:replace="~{components/back-button :: backButton(@{/lecturer/classes/{id}/members(id=${classroom.id})}, 'Quay lại chi tiết')}"></a>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tiêu đề node</th>
                                    <th>Tiên quyết</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(nodes)}">
                                    <td colspan="5" class="text-center text-muted py-4">
                                        Lộ trình chưa có node.
                                        <a th:href="@{/lecturer/learning-paths/{id}(id=${classroom.learningPath.id})}">Thêm node</a>
                                    </td>
                                </tr>
                                <tr th:each="n, stat : ${nodes}">
                                    <td th:text="${stat.count}"></td>
                                    <td>
                                        <div class="fw-semibold" th:text="${n.title}"></div>
                                        <div th:if="${n.description != null and !#strings.isEmpty(n.description)}"
                                             class="text-muted small text-truncate node-description-cell"
                                             th:text="${n.description}"></div>
                                    </td>
                                    <td>
                                        <span th:if="${n.prerequisiteTitle != null}"
                                              class="badge bg-light text-dark border"
                                              th:text="${n.prerequisiteTitle}"></span>
                                        <span th:unless="${n.prerequisiteTitle != null}" class="text-muted">—</span>
                                    </td>
                                    <td>
                                        <span th:if="${n.status == 'VISIBLE'}" class="status-badge status-active">VISIBLE</span>
                                        <span th:unless="${n.status == 'VISIBLE'}" class="status-badge status-inactive">HIDDEN</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="table-actions justify-content-end">
                                            <form th:if="${n.status == 'VISIBLE'}"
                                                  th:action="@{/lecturer/classes/{cid}/nodes/{nid}/hide(cid=${classroom.id}, nid=${n.nodeId})}"
                                                  method="post" class="table-action-form">
                                                <button type="submit" class="table-action-btn"
                                                        title="Ẩn node"
                                                        aria-label="Ẩn node">
                                                    <i class="ti ti-eye-off"></i>
                                                </button>
                                            </form>
                                            <form th:unless="${n.status == 'VISIBLE'}"
                                                  th:action="@{/lecturer/classes/{cid}/nodes/{nid}/show(cid=${classroom.id}, nid=${n.nodeId})}"
                                                  method="post" class="table-action-form">
                                                <button type="submit" class="table-action-btn is-positive"
                                                        title="Hiện node"
                                                        aria-label="Hiện node">
                                                    <i class="ti ti-eye"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
