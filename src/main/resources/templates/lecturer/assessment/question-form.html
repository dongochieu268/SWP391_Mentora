<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm câu hỏi | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <div>
                                <h5 class="card-title fw-semibold mb-1">Thêm câu hỏi trắc nghiệm</h5>
                                <p class="text-muted small mb-0">
                                    Bài test: <span class="fw-semibold" th:text="${assessment.title}"></span>
                                </p>
                            </div>
                            <a th:href="@{/lecturer/assessments/{id}(id=${assessment.id})}" class="btn btn-light border">
                                <i class="ti ti-arrow-left me-1"></i> Quay lại bài test
                            </a>
                        </div>

                        <form th:action="@{/lecturer/assessments/{id}/questions(id=${assessment.id})}"
                              method="post"
                              th:object="${questionForm}">
                            <div class="mb-3">
                                <label class="form-label">Nội dung câu hỏi <span class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{content}" rows="3" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Mức độ</label>
                                    <select class="form-select" th:field="*{difficulty}">
                                        <option th:each="difficulty : ${difficultyOptions}"
                                                th:value="${difficulty.name()}"
                                                th:text="${difficulty.name()}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Loại câu</label>
                                    <select class="form-select" th:field="*{questionType}">
                                        <option th:each="questionType : ${questionTypes}"
                                                th:value="${questionType.name()}"
                                                th:text="${questionType.name()}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Điểm</label>
                                    <input type="number" class="form-control" th:field="*{score}" min="0.1" step="0.1" required>
                                </div>
                            </div>

                            <div class="mb-2 fw-semibold">Đáp án</div>
                            <div class="input-group mb-2" th:each="idx : ${#numbers.sequence(0,3)}">
                                <div class="input-group-text">
                                    <input class="form-check-input mt-0"
                                           type="radio"
                                           th:field="*{correctOptionIndex}"
                                           th:value="${idx}"
                                           th:required="${idx == 0}">
                                </div>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{optionContents[__${idx}__]}"
                                       th:placeholder="${'Đáp án ' + (idx + 1)}">
                            </div>
                            <div class="form-text mb-3">Chọn radio ở đáp án đúng. Cần ít nhất 2 đáp án có nội dung.</div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="ti ti-plus me-1"></i> Thêm câu hỏi
                                </button>
                                <a th:href="@{/lecturer/assessments/{id}(id=${assessment.id})}" class="btn btn-light border">
                                    Hủy
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
