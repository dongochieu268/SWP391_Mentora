<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment: adminHeader(user)
  Usage: <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>
-->
<header th:fragment="adminHeader(user)" class="app-header">
  <nav class="navbar navbar-expand-lg navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item d-block d-xl-none">
        <button class="nav-link sidebartoggler border-0 bg-transparent" id="headerCollapse" type="button"
           aria-label="Mở menu điều hướng">
          <i class="ti ti-menu-2" aria-hidden="true"></i>
        </button>
      </li>
    </ul>

    <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
      <div class="admin-header-label d-none d-md-flex me-auto align-items-center gap-2">
        <span class="admin-header-dot"></span>
        <span>Khu vực quản trị</span>
      </div>
      <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
        <li class="nav-item dropdown">
          <button class="nav-link border-0 bg-transparent" type="button" id="drop2"
             data-bs-toggle="dropdown" aria-expanded="false"
             aria-label="Mở menu tài khoản">
            <img th:src="@{/assets/images/profile/user-1.jpg}" alt="Ảnh đại diện"
                 width="35" height="35" class="rounded-circle">
          </button>
          <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
            <div class="message-body">
              <div class="d-flex align-items-center gap-2 dropdown-item account-meta-item">
                <i class="ti ti-user fs-6"></i>
                <p class="mb-0 fs-3" th:text="${user.fullName}">Admin</p>
              </div>
              <div class="d-flex align-items-center gap-2 dropdown-item account-meta-item">
                <i class="ti ti-mail fs-6"></i>
                <p class="mb-0 fs-3" th:text="${user.email}">admin@mentora.com</p>
              </div>
              <a th:href="@{/logout}" class="btn btn-outline-primary mx-3 mt-2 d-block">Đăng xuất</a>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </nav>
</header>

</body>
</html>
