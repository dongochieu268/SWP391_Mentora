<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý node lớp học | mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h5 class="fw-semibold mb-1" th:text="${classroom.name}"></h5>
                        <p class="text-muted small mb-0">
                            Môn: <span th:text="${classroom.subject.code + ' — ' + classroom.subject.name}"></span>
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/lecturer/classes/{id}/members(id=${classroom.id})}"
                           class="btn btn-outline-success btn-sm">
                            <i class="ti ti-users me-1"></i> Thành viên
                        </a>
                        <a th:href="@{/lecturer/classes}" class="btn btn-outline-secondary btn-sm">
                            <i class="ti ti-arrow-left me-1"></i> Danh sách lớp
                        </a>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3">Lộ trình học của lớp</h6>
                        <p class="mb-3" th:if="${classroom.learningPath != null}">
                            Đang gắn: <strong th:text="${classroom.learningPath.name}"></strong>
                        </p>
                        <form th:action="@{/lecturer/classes/{id}/nodes/attach-path(id=${classroom.id})}"
                              method="post" class="row g-2 align-items-end">
                            <div class="col-md-8">
                                <label class="form-label">Chọn lộ trình</label>
                                <select class="form-select" name="learningPathId" required>
                                    <option value="">-- Chọn lộ trình --</option>
                                    <option th:each="p : ${learningPaths}"
                                            th:value="${p.id}"
                                            th:text="${p.name}"
                                            th:selected="${classroom.learningPath != null and classroom.learningPath.id == p.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="ti ti-link me-1"></i> Gắn lộ trình
                                </button>
                            </div>
                        </form>
                        <p th:if="${#lists.isEmpty(learningPaths)}" class="text-muted small mb-0 mt-2">
                            Chưa có lộ trình cho môn này.
                            <a th:href="@{/lecturer/learning-paths}">Tạo lộ trình học</a>
                        </p>
                    </div>
                </div>

                <div class="card" th:if="${classroom.learningPath != null}">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tiêu đề node</th>
                                    <th>Tiên quyết</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(nodes)}">
                                    <td colspan="5" class="text-center text-muted py-4">
                                        Lộ trình chưa có node.
                                        <a th:href="@{/lecturer/learning-paths/{id}(id=${classroom.learningPath.id})}">Thêm node</a>
                                    </td>
                                </tr>
                                <tr th:each="n, stat : ${nodes}">
                                    <td th:text="${stat.count}"></td>
                                    <td>
                                        <div class="fw-semibold" th:text="${n.title}"></div>
                                        <div th:if="${n.description != null and !#strings.isEmpty(n.description)}"
                                             class="text-muted small text-truncate" style="max-width: 320px;"
                                             th:text="${n.description}"></div>
                                    </td>
                                    <td>
                                        <span th:if="${n.prerequisiteTitle != null}"
                                              class="badge bg-light text-dark border"
                                              th:text="${n.prerequisiteTitle}"></span>
                                        <span th:unless="${n.prerequisiteTitle != null}" class="text-muted">—</span>
                                    </td>
                                    <td>
                                        <span th:if="${n.status == 'VISIBLE'}" class="badge bg-success">VISIBLE</span>
                                        <span th:unless="${n.status == 'VISIBLE'}" class="badge bg-secondary">HIDDEN</span>
                                    </td>
                                    <td class="text-end">
                                        <form th:if="${n.status == 'VISIBLE'}"
                                              th:action="@{/lecturer/classes/{cid}/nodes/{nid}/hide(cid=${classroom.id}, nid=${n.nodeId})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary">
                                                <i class="ti ti-eye-off"></i> Ẩn
                                            </button>
                                        </form>
                                        <form th:unless="${n.status == 'VISIBLE'}"
                                              th:action="@{/lecturer/classes/{cid}/nodes/{nid}/show(cid=${classroom.id}, nid=${n.nodeId})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-success">
                                                <i class="ti ti-eye"></i> Hiện
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
