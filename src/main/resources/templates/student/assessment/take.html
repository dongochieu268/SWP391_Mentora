<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${assessment.title} + ' | mentora'">Làm bài test | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/student-sidebar :: studentSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div class="mb-4">
                    <a th:href="@{/student/classrooms/{cid}/roadmap(cid=${classroomId})}" class="text-muted small text-decoration-none">
                        <i class="ti ti-arrow-left me-1"></i>Trở lại roadmap
                    </a>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between gap-3">
                            <div>
                                <h4 class="fw-bold mb-1" th:text="${assessment.title}"></h4>
                                <p class="text-muted mb-0" th:if="${assessment.description != null}" th:text="${assessment.description}"></p>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-primary" th:text="${assessment.totalScore} + ' điểm'"></span>
                                <span class="badge bg-light text-dark border" th:text="${assessment.durationMinutes} + ' phút'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <form th:action="@{/student/classrooms/{cid}/assessments/attempts/{aid}/submit(cid=${classroomId},aid=${attempt.id})}"
                      method="post"
                      onsubmit="return confirm('Nộp bài test này?');">
                    <div class="card">
                        <div class="card-body">
                            <div th:if="${#lists.isEmpty(questions)}" class="text-center text-muted py-4">
                                Bài test chưa có câu hỏi.
                            </div>

                            <div th:unless="${#lists.isEmpty(questions)}">
                                <div class="border rounded p-3 mb-3" th:each="q, stat : ${questions}">
                                    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                                        <span class="badge bg-light text-dark border" th:text="${'Câu ' + stat.count}"></span>
                                        <span class="badge bg-info text-dark" th:text="${q.difficulty}"></span>
                                        <span class="badge bg-primary" th:text="${q.score} + ' điểm'"></span>
                                    </div>
                                    <div class="fw-semibold mb-3" th:text="${q.content}"></div>

                                    <div class="form-check mb-2"
                                         th:each="opt : ${optionsByQuestionId[q.id]}">
                                        <input class="form-check-input"
                                               type="radio"
                                               th:name="${'answers_' + q.id}"
                                               th:id="${'q' + q.id + '_opt' + opt.id}"
                                               th:value="${opt.id}">
                                        <label class="form-check-label"
                                               th:for="${'q' + q.id + '_opt' + opt.id}"
                                               th:text="${opt.content}"></label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end">
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="ti ti-send me-1"></i> Nộp bài
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
