<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lớp học | mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <div>
                                <h5 class="card-title fw-semibold mb-1">Quản lý lớp học</h5>
                                <p class="text-muted small mb-0">Tạo lớp và gắn môn học, lộ trình, học kỳ.</p>
                            </div>
                            <a th:href="@{/lecturer/classes/new}" class="btn btn-primary">
                                <i class="ti ti-plus me-1"></i> Tạo lớp mới
                            </a>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tên lớp</th>
                                    <th>Môn học</th>
                                    <th>Lộ trình</th>
                                    <th>Học kỳ</th>
                                    <th>Mã mời</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(classes)}">
                                    <td colspan="8" class="text-center text-muted py-4">
                                        Chưa có lớp học nào.
                                        <a th:href="@{/lecturer/classes/new}">Tạo lớp đầu tiên</a>
                                    </td>
                                </tr>
                                <tr th:each="c, stat : ${classes}">
                                    <td th:text="${stat.count}"></td>
                                    <td class="fw-semibold" th:text="${c.name}"></td>
                                    <td>
                                        <span class="badge bg-info text-dark" th:text="${c.subject.code}"></span>
                                        <span th:text="${c.subject.name}"></span>
                                    </td>
                                    <td th:text="${c.learningPath.name}"></td>
                                    <td th:text="${c.semester.name}"></td>
                                    <td><code th:text="${c.inviteCode}"></code></td>
                                    <td>
                                        <span th:if="${c.status == 'OPEN'}" class="badge bg-success">OPEN</span>
                                        <span th:unless="${c.status == 'OPEN'}" class="badge bg-secondary"
                                              th:text="${c.status}">CLOSE</span>
                                    </td>
                                    <td class="text-end">
                                        <a th:href="@{/lecturer/classes/{id}/nodes(id=${c.id})}"
                                           class="btn btn-sm btn-warning me-1">
                                            <i class="ti ti-eye"></i> Ẩn/Hiện
                                        </a>
                                        <a th:href="@{/lecturer/classes/{id}/members(id=${c.id})}"
                                           class="btn btn-sm btn-outline-success me-1">
                                            <i class="ti ti-users"></i> Thành viên
                                        </a>
                                        <a th:href="@{/lecturer/classes/{id}/edit(id=${c.id})}"
                                           class="btn btn-sm btn-outline-primary me-1">
                                            <i class="ti ti-edit"></i> Sửa
                                        </a>
                                        <form th:action="@{/lecturer/classes/{id}/delete(id=${c.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Xóa lớp học này?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="ti ti-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
