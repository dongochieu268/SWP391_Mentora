<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cấu hình Tiên Quyết | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/admin-sidebar :: adminSidebar('subjects')}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">

                <div class="d-flex align-items-center mb-4">
                    <span class="me-3">
                        <a th:replace="~{components/back-button :: backButton(@{/admin/subjects}, 'Quay lại')}"></a>
                    </span>
                    <h4 class="mb-0 fw-bold">Thiết lập môn tiên quyết cho:
                        <span class="text-primary" th:text="${mainSubject.code + ' - ' + mainSubject.name}"></span>
                    </h4>
                </div>

                <div th:if="${successMessage}" class="alert alert-success fw-bold">
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger fw-bold">
                    <span th:text="${errorMessage}"></span>
                </div>

                <div class="row">
                    <div class="col-lg-5">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h5 class="card-title fw-bold mb-4">Gán môn học trước</h5>
                                <form th:action="@{/admin/subjects/{id}/prerequisites/add(id=${mainSubject.id})}" method="post">
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Chọn môn yêu cầu</label>
                                        <select name="prerequisiteSubjectId" class="form-select" required>
                                            <option value="">-- Chọn từ danh sách --</option>
                                            <option th:each="s : ${allSubjects}"
                                                    th:value="${s.id}"
                                                    th:text="${s.code + ' - ' + s.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 fw-bold">Thêm ràng buộc</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h5 class="card-title fw-bold mb-4">Ràng buộc hiện tại</h5>
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle text-nowrap">
                                        <thead class="table-light">
                                        <tr>
                                            <th>Môn tiên quyết</th>
                                            <th class="text-end">Hành động</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="pre : ${prerequisites}">
                                            <td>
                                                <span class="fw-bold text-dark"
                                                      th:with="preSubject=${subjectsById.get(pre.prerequisiteSubjectId)}"
                                                      th:text="${preSubject != null ? preSubject.code + ' - ' + preSubject.name : pre.prerequisiteSubjectId}"></span>
                                            </td>
                                            <td class="text-end">
                                                <form th:action="@{/admin/subjects/{sId}/prerequisites/delete/{preId}(sId=${mainSubject.id}, preId=${pre.prerequisiteSubjectId})}"
                                                      method="post" class="table-action-form">
                                                    <button type="submit" class="table-action-btn is-danger"
                                                            title="Gỡ môn tiên quyết"
                                                            aria-label="Gỡ môn tiên quyết"
                                                            onclick="return confirm('Bạn có chắc muốn gỡ ràng buộc này?');">
                                                        <i class="ti ti-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(prerequisites)}">
                                            <td colspan="2" class="text-center text-muted py-4">
                                                Môn học này hiện chưa có ràng buộc tiên quyết nào.
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
