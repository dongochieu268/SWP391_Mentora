<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment: testCard(a) — thẻ hiển thị 1 bài test trong lưới card.
  Usage: <div th:replace="~{components/assessment-card :: testCard(${a})}"></div>
-->
<div th:fragment="testCard(a)" class="card h-100 border shadow-none mb-0">
    <div class="card-body d-flex flex-column">
        <h5 class="fw-semibold mb-2" th:text="${a.title}"></h5>
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
            <span class="badge bg-light text-dark border" th:text="${a.type}"></span>
            <th:block th:replace="~{components/status-badge :: statusBadge(${a.status})}"></th:block>
        </div>
        <p class="text-muted small mb-3"
           th:if="${a.description != null and !#strings.isEmpty(a.description)}"
           th:text="${#strings.length(a.description) > 90 ? #strings.substring(a.description, 0, 90) + '...' : a.description}"></p>
        <div class="d-flex gap-3 text-muted small mb-3 mt-auto">
            <span><i class="ti ti-award me-1"></i><span th:text="${a.totalScore}"></span> điểm</span>
            <span><i class="ti ti-clock me-1"></i><span th:text="${a.durationMinutes}"></span> phút</span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/lecturer/assessments/{id}(id=${a.id})}"
               class="btn btn-sm btn-primary flex-grow-1">
                <i class="ti ti-eye me-1"></i> Xem chi tiết
            </a>
            <form th:if="${a.status != 'DRAFT'}"
                  th:action="@{/lecturer/assessments/{id}/clone(id=${a.id})}"
                  method="post"
                  onsubmit="return confirm('Clone bài test này thành bản nháp mới?');">
                <button type="submit" class="btn btn-sm btn-outline-secondary" title="Nhân bản">
                    <i class="ti ti-copy"></i>
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
