<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo lộ trình | mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <h5 class="card-title fw-semibold mb-0">Tạo lộ trình học mới</h5>
                            <a th:href="@{/lecturer/learning-paths}" class="btn btn-light border">
                                <i class="ti ti-arrow-left me-1"></i> Quay lại
                            </a>
                        </div>

                        <form th:action="@{/lecturer/learning-paths}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Môn học <span class="text-danger">*</span></label>
                                <select class="form-select" name="subjectId" required>
                                    <option value="">-- Chọn môn học --</option>
                                    <option th:each="s : ${activeSubjects}"
                                            th:value="${s.id}"
                                            th:text="${s.code + ' — ' + s.name}"></option>
                                </select>
                                <div class="form-text text-muted">Chỉ hiển thị môn học đang ACTIVE.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tên lộ trình <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="name"
                                       maxlength="150" required placeholder="VD: Lộ trình cơ bản môn SWP391">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mô tả</label>
                                <textarea class="form-control" name="description" rows="3"
                                          maxlength="1000" placeholder="Mô tả ngắn về lộ trình..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="ti ti-check me-1"></i> Tạo lộ trình
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
