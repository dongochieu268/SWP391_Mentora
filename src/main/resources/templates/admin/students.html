<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý sinh viên | mentora</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

  <aside th:replace="~{layout/admin-sidebar :: adminSidebar(${activePage})}"></aside>

  <div class="body-wrapper">
    <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

    <div class="body-wrapper-inner">
      <div class="container-fluid">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title fw-semibold mb-4">UC08 — Quản lý Sinh viên</h5>

            <!-- Filter form -->
            <form th:action="@{/admin/students}" method="get" class="row g-3 mb-4">
              <div class="col-md-5">
                <div class="input-group">
                  <span class="input-group-text"><i class="ti ti-search"></i></span>
                  <input type="text" class="form-control" name="search"
                         placeholder="Tên hoặc email sinh viên..."
                         th:value="${search}">
                </div>
              </div>
              <div class="col-md-5">
                <div class="btn-group w-100" role="group">
                  <input type="radio" class="btn-check" name="status" id="filterAll"
                         value="" th:checked="${selectedStatus == ''}">
                  <label class="btn btn-outline-secondary" for="filterAll">Tất cả</label>

                  <input type="radio" class="btn-check" name="status" id="filterActive"
                         value="ACTIVE" th:checked="${selectedStatus == 'ACTIVE'}">
                  <label class="btn btn-outline-success" for="filterActive">ACTIVE</label>

                  <input type="radio" class="btn-check" name="status" id="filterBanned"
                         value="BANNED" th:checked="${selectedStatus == 'BANNED'}">
                  <label class="btn btn-outline-danger" for="filterBanned">BANNED</label>
                </div>
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                  <i class="ti ti-filter me-1"></i> Lọc
                </button>
              </div>
            </form>

            <!-- Table -->
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                  <th>STT</th>
                  <th>Sinh viên</th>
                  <th>Email</th>
                  <th>Trạng thái</th>
                  <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(students)}">
                  <td colspan="5" class="text-center text-muted py-4">Không tìm thấy sinh viên nào.</td>
                </tr>
                <tr th:each="s, stat : ${students}">
                  <td th:text="${stat.count}"></td>
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <img th:src="'/assets/images/profile/user-' + ${s.id % 6 + 1} + '.jpg'"
                           width="35" height="35" class="rounded-circle" alt="">
                      <span class="fw-semibold" th:text="${s.fullName}"></span>
                    </div>
                  </td>
                  <td th:text="${s.email}"></td>
                  <td>
                    <span th:if="${s.status == 'ACTIVE'}"   class="badge bg-success">ACTIVE</span>
                    <span th:if="${s.status == 'BANNED'}"   class="badge bg-danger">BANNED</span>
                    <span th:if="${s.status == 'INACTIVE'}" class="badge bg-secondary">INACTIVE</span>
                  </td>
                  <td class="text-end">
                    <button th:if="${s.status == 'ACTIVE'}"
                            class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal" data-bs-target="#modalSVStatus"
                            th:data-id="${s.id}" th:data-name="${s.fullName}" data-action="BANNED">
                      <i class="ti ti-ban me-1"></i> Cấm
                    </button>
                    <button th:if="${s.status != 'ACTIVE'}"
                            class="btn btn-sm btn-outline-success"
                            data-bs-toggle="modal" data-bs-target="#modalSVStatus"
                            th:data-id="${s.id}" th:data-name="${s.fullName}" data-action="ACTIVE">
                      <i class="ti ti-player-play me-1"></i> Kích hoạt
                    </button>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>

            <div class="mt-3">
              <span class="text-muted small"
                    th:text="'Hiển thị ' + ${#lists.size(students)} + ' sinh viên'"></span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Modal: đổi trạng thái SV -->
<div class="modal fade" id="modalSVStatus" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Xác nhận thay đổi trạng thái</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Bạn có chắc muốn <strong id="svActionText"></strong> tài khoản sinh viên
        <strong id="svName"></strong>?
      </div>
      <div class="modal-footer">
        <button class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
        <form id="formSVStatus" method="post">
          <input type="hidden" name="status" id="svStatusVal">
          <button type="submit" class="btn" id="svConfirmBtn">Xác nhận</button>
        </form>
      </div>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
<script>
  document.querySelectorAll('[data-bs-target="#modalSVStatus"]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = this.dataset.id, name = this.dataset.name, action = this.dataset.action;
      document.getElementById('svName').textContent = name;
      document.getElementById('svStatusVal').value = action;
      document.getElementById('formSVStatus').action = '/admin/students/' + id + '/status';
      var confirmBtn = document.getElementById('svConfirmBtn');
      var actionText = document.getElementById('svActionText');
      if (action === 'BANNED') {
        actionText.textContent = 'cấm';
        confirmBtn.className = 'btn btn-danger';
        confirmBtn.textContent = 'Cấm tài khoản';
      } else {
        actionText.textContent = 'kích hoạt lại';
        confirmBtn.className = 'btn btn-success';
        confirmBtn.textContent = 'Kích hoạt';
      }
    });
  });
</script>
</body>
</html>
