<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${classroom.name} + ' – Lộ trình | Mentora'">Lộ trình học | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/student-sidebar :: studentSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">

                <!-- ── Header + Progress ── -->
                <div class="card mb-4">
                    <div class="card-body">
                        <a th:replace="~{components/back-button :: backButton(@{/student/classrooms}, 'Danh sách lớp học')}"></a>
                        <h4 class="card-title mt-2 mb-1" th:text="${classroom.name}"></h4>
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <span class="badge bg-info text-dark" th:text="${classroom.subject.code}"></span>
                            <span class="text-muted" th:text="${classroom.learningPath.name}"></span>
                        </div>
                        <div class="row mt-3 g-3">
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="small fw-semibold">Tiến độ</span>
                                    <span class="small text-muted"
                                          th:text="${roadmap.completedVisibleCount} + '/' + ${roadmap.visibleNodeCount} + ' bài đã học'"></span>
                                </div>
                                <div class="progress progress-standard">
                                    <div class="progress-bar bg-success" role="progressbar"
                                         th:style="'width:' + ${roadmap.completionPercent} + '%'"
                                         th:attr="aria-valuenow=${roadmap.completionPercent}"
                                         aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                                <p class="small text-muted mb-0 mt-1"
                                   th:text="${roadmap.completionPercent} + '% đã học'"></p>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="small fw-semibold">Điểm</span>
                                    <span class="small text-muted" th:if="${roadmap.hasScorableNodes}"
                                          th:text="${roadmap.totalScoreEarned} + '/' + ${roadmap.totalScorePossible}"></span>
                                </div>
                                <div class="progress progress-standard" th:if="${roadmap.hasScorableNodes}">
                                    <div class="progress-bar bg-primary" role="progressbar"
                                         th:style="'width:' + ${roadmap.scorePercent} + '%'"
                                         th:attr="aria-valuenow=${roadmap.scorePercent}"
                                         aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                                <p class="small text-muted mb-0 mt-1" th:if="${roadmap.hasScorableNodes}"
                                   th:text="${roadmap.scorePercent} + '% điểm tối đa'"></p>
                                <p class="small text-muted mb-0" th:unless="${roadmap.hasScorableNodes}">
                                    Chưa có bài test nào.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Roadmap Body ── -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title fw-semibold mb-4">
                            <i class="ti ti-route me-1"></i>Lộ trình học tập
                            <span class="badge bg-secondary ms-1" th:text="${#lists.size(roadmap.nodes)}"></span>
                        </h5>

                        <div th:if="${#lists.isEmpty(roadmap.nodes)}" class="text-center text-muted py-4">
                            Lớp chưa có node nào trong lộ trình.
                        </div>

                        <div th:if="${not #lists.isEmpty(roadmap.nodes) and roadmap.visibleNodeCount == 0}"
                             class="text-center text-muted py-4">
                            <i class="ti ti-eye-off fs-3 d-block mb-2"></i>
                            Giảng viên chưa mở bài học nào.
                        </div>

                        <!-- ── Node list ── -->
                        <div th:if="${not #lists.isEmpty(roadmap.nodes) and roadmap.visibleNodeCount > 0}">
                            <div th:each="item, stat : ${roadmap.nodes}">

                                <!-- connector line (trừ node đầu tiên) -->
                                <div class="node-connector" th:unless="${stat.first}"></div>

                                <div class="list-group-item px-3 py-3 border rounded roadmap-node mb-0"
                                     th:classappend="${item.state.name() == 'HIDDEN'} ? ' is-hidden' : ''">
                                    <div class="roadmap-node-row">
                                        <div class="roadmap-node-index">
                                            <span class="badge rounded-circle bg-light text-dark border"
                                                  th:text="${stat.count}"></span>
                                        </div>
                                        <div class="flex-grow-1">
                                            <div class="d-flex align-items-center flex-wrap gap-2 mb-1">
                                                <h6 class="mb-0 fw-semibold" th:text="${item.node.title}"></h6>
                                                <span th:if="${item.state.name() == 'COMPLETED'}" class="status-badge status-active">Đã hoàn thành</span>
                                                <span th:if="${item.state.name() == 'ACCESSIBLE'}" class="status-badge status-info">Có thể học</span>
                                                <span th:if="${item.state.name() == 'LOCKED'}" class="status-badge status-pending">Đang khóa</span>
                                                <span th:if="${item.state.name() == 'HIDDEN'}" class="status-badge status-inactive">Chưa mở</span>
                                                <span th:if="${item.hasLevels}" class="badge bg-primary-subtle text-primary"
                                                      th:text="'Lv. ' + ${item.bestLevelNumber != null ? item.bestLevelNumber : 0} + '/' + ${item.totalLevels}"></span>
                                                <span th:if="${item.bestScore != null}" class="badge bg-light text-dark border"
                                                      th:text="'Điểm cao nhất: ' + ${item.bestScore}"></span>
                                            </div>
                                            <p class="text-muted small mb-0"
                                               th:if="${item.node.description != null}"
                                               th:text="${item.node.description}"></p>
                                            <p class="small mb-0 text-warning"
                                               th:if="${item.state.name() == 'LOCKED' and item.prerequisiteTitle != null}">
                                                <i class="ti ti-lock me-1"></i>
                                                Hoàn thành node tiên quyết:
                                                <strong th:text="${item.prerequisiteTitle}"></strong>
                                            </p>
                                            <p class="small mb-0 text-muted"
                                               th:if="${item.state.name() == 'HIDDEN'}">
                                                <i class="ti ti-lock me-1"></i>
                                                Giảng viên chưa mở nội dung này.
                                            </p>
                                        </div>
                                        <div class="roadmap-node-action">
                                            <a th:if="${item.state.name() == 'ACCESSIBLE'}"
                                               th:href="@{/student/classrooms/{cid}/nodes/{nid}(cid=${classroom.id}, nid=${item.node.id})}"
                                               class="btn btn-sm btn-primary fw-semibold px-3 d-inline-flex align-items-center">
                                                <i class="ti ti-player-play me-1"></i> Vào học
                                            </a>
                                            <a th:if="${item.state.name() == 'COMPLETED'}"
                                               th:href="@{/student/classrooms/{cid}/nodes/{nid}(cid=${classroom.id}, nid=${item.node.id})}"
                                               class="btn btn-sm btn-outline-success fw-semibold px-3 d-inline-flex align-items-center">
                                                <i class="ti ti-refresh me-1"></i> Xem lại
                                            </a>
                                            <button th:if="${item.locked}"
                                                    class="btn btn-sm btn-light text-muted px-3 d-inline-flex align-items-center" disabled>
                                                <i class="ti ti-lock me-1"></i> Đang khóa
                                            </button>
                                        </div>
                                    </div>
                                </div>

                            </div><!-- end th:each -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
