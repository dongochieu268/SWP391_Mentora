<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment: studentSidebar(activePage)
  Usage: <aside th:replace="~{layout/student-sidebar :: studentSidebar(${activePage})}"></aside>
  activePage values: 'dashboard' | 'classrooms'
-->
<aside th:fragment="studentSidebar(activePage)" class="left-sidebar student-navigation">
  <div>
    <div class="brand-logo d-flex align-items-center justify-content-between">
      <a th:href="@{/student/dashboard}" class="text-nowrap logo-img">
        <img th:src="@{/assets/images/logos/logo.svg}" alt="logo"/>
      </a>
      <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse"
           role="button" tabindex="0" aria-label="Đóng menu điều hướng">
        <i class="ti ti-x fs-6" aria-hidden="true"></i>
      </div>
    </div>

    <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
      <ul id="sidebarnav">

        <li class="nav-small-cap">
          <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4" aria-hidden="true"></iconify-icon>
          <span class="hide-menu">Học sinh</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/student/dashboard}"
             th:classappend="${activePage == 'dashboard'} ? ' active'" aria-expanded="false">
            <i class="ti ti-home" aria-hidden="true"></i>
            <span class="hide-menu">Dashboard</span>
          </a>
        </li>

        <li class="nav-small-cap">
          <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4" aria-hidden="true"></iconify-icon>
          <span class="hide-menu">Học tập</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/student/classrooms}"
             th:classappend="${activePage == 'classrooms'} ? ' active'" aria-expanded="false">
            <i class="ti ti-school" aria-hidden="true"></i>
            <span class="hide-menu">Lớp học của tôi</span>
          </a>
        </li>

      </ul>

      <div th:if="${sidebarRoadmap != null and not #lists.isEmpty(sidebarRoadmap.nodes)}"
           class="sidebar-roadmap-panel">
        <div class="sidebar-roadmap-heading">
          <div>
            <span>Lộ trình lớp</span>
            <strong th:text="${sidebarRoadmap.classroom.learningPath.name}">Learning path</strong>
          </div>
        </div>

        <div class="sidebar-roadmap-list">
          <th:block th:each="item, stat : ${sidebarRoadmap.nodes}">
            <a th:if="${item.state.name() == 'ACCESSIBLE' or item.state.name() == 'COMPLETED'}"
               th:href="@{/student/classrooms/{cid}/nodes/{nid}(cid=${sidebarRoadmap.classroom.id}, nid=${item.node.id})}"
               class="sidebar-roadmap-node"
               th:classappend="${' state-' + #strings.toLowerCase(item.state.name()) + ((sidebarCurrentNodeId != null and item.node.id == sidebarCurrentNodeId) ? ' is-current' : '')}">
              <span class="sidebar-roadmap-index">
                <i th:if="${item.state.name() == 'COMPLETED'}" class="ti ti-check"></i>
                <span th:unless="${item.state.name() == 'COMPLETED'}" th:text="${stat.count}"></span>
              </span>
              <span class="sidebar-roadmap-copy">
                <span class="sidebar-roadmap-title" th:text="${item.node.title}">Node title</span>
                <span class="sidebar-roadmap-state"
                      th:text="${sidebarCurrentNodeId != null and item.node.id == sidebarCurrentNodeId ? 'Đang học' : (item.state.name() == 'COMPLETED' ? 'Đã hoàn thành' : 'Có thể học')}"></span>
              </span>
            </a>

            <div th:unless="${item.state.name() == 'ACCESSIBLE' or item.state.name() == 'COMPLETED'}"
                 class="sidebar-roadmap-node is-disabled"
                 th:classappend="${' state-' + #strings.toLowerCase(item.state.name())}">
              <span class="sidebar-roadmap-index">
                <i class="ti ti-lock"></i>
              </span>
              <span class="sidebar-roadmap-copy">
                <span class="sidebar-roadmap-title" th:text="${item.node.title}">Node title</span>
                <span class="sidebar-roadmap-state"
                      th:text="${item.state.name() == 'HIDDEN' ? 'Chưa mở' : 'Đang khóa'}"></span>
              </span>
            </div>
          </th:block>
        </div>
      </div>

      <div th:if="${sidebarRoadmap != null and #lists.isEmpty(sidebarRoadmap.nodes)}"
           class="sidebar-roadmap-panel">
        <div class="sidebar-roadmap-empty">
          <i class="ti ti-route-off"></i>
          <span>Chưa có node trong lộ trình.</span>
        </div>
      </div>

      <div th:if="${sidebarRoadmap == null}"
           class="mx-3 mt-4 p-3 rounded-4 text-white"
           style="background: linear-gradient(145deg, #1d4ed8, #4f46e5); box-shadow: 0 14px 28px rgba(37, 99, 235, .2);">
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="ti ti-sparkles fs-5" aria-hidden="true"></i>
          <strong class="small">Mỗi ngày một bước</strong>
        </div>
        <p class="small mb-0" style="color: rgba(255,255,255,.74); line-height: 1.5;">
          Hoàn thành từng bài nhỏ để tiến gần hơn tới mục tiêu.
        </p>
      </div>
    </nav>
  </div>
</aside>

</body>
</html>
