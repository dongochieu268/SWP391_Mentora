<svg width="160" height="40" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left vertical -->
  <line x1="5"  y1="34" x2="5"  y2="6"  stroke="#2563EB" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Left diagonal (top-left → middle-bottom) -->
  <line x1="5"  y1="6"  x2="16" y2="22" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right diagonal (top-right → middle-bottom) -->
  <line x1="27" y1="6"  x2="16" y2="22" stroke="#0EA5E9" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right vertical -->
  <line x1="27" y1="6"  x2="27" y2="34" stroke="#0EA5E9" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Teal inner overlay for depth -->
  <line x1="10" y1="24" x2="16" y2="22" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>
  <line x1="22" y1="24" x2="16" y2="22" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>

  <!-- "mentora" text -->
  <text x="40" y="28"
        font-size="22"
        font-weight="700"
        font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif"
        fill="#0F172A"
        letter-spacing="-0.5">mentora</text>
</svg>
