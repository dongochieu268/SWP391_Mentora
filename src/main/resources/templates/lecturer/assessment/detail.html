<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${assessment.title} + ' | Mentora'">Chi tiết bài test | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="mb-4">
                    <a th:replace="~{components/back-button :: backButton(@{/lecturer/assessments}, 'Quay lại danh sách bài test')}"></a>
                </div>

                <div class="row">
                    <div class="col-lg-5">
                        <div class="card mb-4">
                            <div class="card-body">
                                <div class="d-flex align-items-start justify-content-between mb-3">
                                    <div>
                                        <h5 class="card-title fw-semibold mb-1" th:text="${assessment.title}"></h5>
                                        <span th:if="${assessment.status == 'DRAFT'}" class="status-badge status-pending">DRAFT</span>
                                        <span th:if="${assessment.status == 'PUBLISHED'}" class="status-badge status-active">PUBLISHED</span>
                                        <span th:if="${assessment.status == 'ARCHIVED'}" class="status-badge status-inactive">ARCHIVED</span>
                                    </div>
                                    <form th:if="${canEdit}"
                                          th:action="@{/lecturer/assessments/{id}/publish(id=${assessment.id})}"
                                          method="post"
                                          onsubmit="return confirm('Publish bài test này? Sau khi publish sẽ không sửa được câu hỏi.');">
                                        <button type="submit" class="btn btn-success btn-sm">
                                            <i class="ti ti-upload me-1"></i> Publish
                                        </button>
                                    </form>
                                    <form th:unless="${canEdit}"
                                          th:action="@{/lecturer/assessments/{id}/clone(id=${assessment.id})}"
                                          method="post"
                                          onsubmit="return confirm('Clone bài test này thành bản DRAFT mới?');">
                                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                                            <i class="ti ti-copy me-1"></i> Clone
                                        </button>
                                    </form>
                                </div>

                                <form th:if="${canEdit}"
                                      th:action="@{/lecturer/assessments/{id}/edit(id=${assessment.id})}"
                                      method="post"
                                      th:object="${form}">
                                    <div class="mb-3">
                                        <label for="title" class="form-label">Tên bài test</label>
                                        <input type="text" class="form-control" th:field="*{title}" maxlength="200" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="description" class="form-label">Mô tả</label>
                                        <textarea class="form-control" th:field="*{description}" rows="3" maxlength="2000"></textarea>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="type" class="form-label">Loại</label>
                                            <select class="form-select" th:field="*{type}">
                                                <option th:each="type : ${typeOptions}"
                                                        th:value="${type.name()}"
                                                        th:text="${type.name()}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="deliveryMode" class="form-label">Hình thức</label>
                                            <select class="form-select" th:field="*{deliveryMode}">
                                                <option th:each="mode : ${deliveryModes}"
                                                        th:value="${mode.name()}"
                                                        th:text="${mode.name()}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="durationMinutes" class="form-label">Thời lượng phút</label>
                                            <input type="number" class="form-control" th:field="*{durationMinutes}" min="1" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="totalScore" class="form-label">Tổng điểm</label>
                                            <input type="number" class="form-control" th:field="*{totalScore}" min="0.1" step="0.1" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="ti ti-device-floppy me-1"></i> Lưu thông tin
                                    </button>
                                </form>

                                <div th:unless="${canEdit}">
                                    <p class="text-muted" th:if="${assessment.description != null}" th:text="${assessment.description}"></p>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <div class="p-3 bg-light rounded">
                                                <div class="text-muted small">Loại</div>
                                                <div class="fw-semibold" th:text="${assessment.type}"></div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="p-3 bg-light rounded">
                                                <div class="text-muted small">Hình thức</div>
                                                <div class="fw-semibold" th:text="${assessment.deliveryMode}"></div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="p-3 bg-light rounded">
                                                <div class="text-muted small">Thời lượng</div>
                                                <div class="fw-semibold" th:text="${assessment.durationMinutes} + ' phút'"></div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="p-3 bg-light rounded">
                                                <div class="text-muted small">Tổng điểm</div>
                                                <div class="fw-semibold" th:text="${assessment.totalScore}"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="text-muted small mt-3 mb-0">
                                        Bài test đã publish nên không thể chỉnh sửa nội dung.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="card">
                            <div class="card-body">
                                <div class="d-flex align-items-center justify-content-between mb-3">
                                    <h5 class="card-title fw-semibold mb-0">Danh sách câu hỏi</h5>
                                    <span class="badge bg-secondary" th:text="${#lists.size(questions)} + ' câu'"></span>
                                </div>

                                <div th:if="${#lists.isEmpty(questions)}" class="text-center text-muted py-4">
                                    Chưa có câu hỏi nào.
                                </div>

                                <div th:unless="${#lists.isEmpty(questions)}">
                                    <div class="border rounded p-3 mb-3" th:each="q, stat : ${questions}">
                                        <div class="d-flex justify-content-between gap-3">
                                            <div>
                                                <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                                                    <span class="badge bg-light text-dark border" th:text="${'Câu ' + stat.count}"></span>
                                                    <span class="badge bg-info text-dark" th:text="${q.difficulty}"></span>
                                                    <span class="badge bg-secondary" th:text="${q.questionType}"></span>
                                                    <span class="badge bg-primary" th:text="${q.score} + ' điểm'"></span>
                                                </div>
                                                <div class="fw-semibold" th:text="${q.content}"></div>
                                            </div>
                                            <form th:if="${canEdit}"
                                                  th:action="@{/lecturer/assessments/{aid}/questions/{qid}/delete(aid=${assessment.id},qid=${q.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Xóa câu hỏi này?');">
                                                <button type="submit" class="table-action-btn is-danger"
                                                        title="Xóa câu hỏi"
                                                        aria-label="Xóa câu hỏi">
                                                    <i class="ti ti-trash"></i>
                                                </button>
                                            </form>
                                        </div>

                                        <ol class="mt-3 mb-0">
                                            <li th:each="opt : ${optionsByQuestionId[q.id]}" class="mb-1">
                                                <span th:text="${opt.content}"></span>
                                                <span th:if="${opt.correct}" class="status-badge status-active ms-2">Đúng</span>
                                            </li>
                                        </ol>
                                    </div>
                                </div>

                                <!-- ===== Form thêm câu hỏi ngay tại trang (đồng bộ với panel builder lộ trình) ===== -->
                                <form th:if="${canEdit}"
                                      th:action="@{/lecturer/assessments/{id}/questions(id=${assessment.id})}"
                                      method="post" class="border rounded p-3 mt-3" style="background:#f8fafc">
                                    <input type="hidden" name="questionType" value="MULTIPLE_CHOICE"/>
                                    <strong class="d-block mb-2"><i class="ti ti-plus me-1"></i>Thêm câu hỏi mới</strong>
                                    <label for="newQuestionContent" class="visually-hidden">Nội dung câu hỏi</label>
                                    <textarea class="form-control mb-2" id="newQuestionContent" name="content" rows="2"
                                              placeholder="Nội dung câu hỏi..." required></textarea>
                                    <div class="row g-2 mb-2">
                                        <div class="col-md-6">
                                            <label for="newQuestionDifficulty" class="form-label small mb-1">Mức độ</label>
                                            <select class="form-select" id="newQuestionDifficulty" name="difficulty">
                                                <option th:each="d : ${difficultyOptions}" th:value="${d}" th:text="${d}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="newQuestionScore" class="form-label small mb-1">Điểm</label>
                                            <input type="number" class="form-control" id="newQuestionScore" name="score"
                                                   value="1" min="0.25" step="0.25" required>
                                        </div>
                                    </div>
                                    <label class="form-label small mb-1">Đáp án
                                        <span class="text-muted">(chọn radio ở đáp án đúng, cần ít nhất 2 đáp án)</span>
                                    </label>
                                    <div id="optionRows">
                                        <div class="input-group mb-1">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctOptionIndex" value="0" checked title="Đáp án đúng" aria-label="Đáp án đúng A">
                                            </div>
                                            <input type="text" class="form-control" name="optionContents" placeholder="Đáp án A" aria-label="Đáp án A" required>
                                        </div>
                                        <div class="input-group mb-1">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctOptionIndex" value="1" title="Đáp án đúng" aria-label="Đáp án đúng B">
                                            </div>
                                            <input type="text" class="form-control" name="optionContents" placeholder="Đáp án B" aria-label="Đáp án B" required>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-light border w-100 mb-2" onclick="addOptionRow()">
                                        <i class="ti ti-plus me-1"></i>Thêm đáp án
                                    </button>
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="ti ti-device-floppy me-1"></i>Lưu câu hỏi
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
<script>
    function addOptionRow() {
        const wrap = document.getElementById('optionRows');
        if (!wrap) return;
        const n = wrap.children.length;
        const div = document.createElement('div');
        div.className = 'input-group mb-1';
        const label = String.fromCharCode(65 + n);
        div.innerHTML =
            '<div class="input-group-text">' +
            '<input class="form-check-input mt-0" type="radio" name="correctOptionIndex" value="' + n + '" title="Đáp án đúng" aria-label="Đáp án đúng ' + label + '">' +
            '</div>' +
            '<input type="text" class="form-control" name="optionContents" placeholder="Đáp án ' + label + '" aria-label="Đáp án ' + label + '" required>';
        wrap.appendChild(div);
    }
</script>
</body>
</html>
