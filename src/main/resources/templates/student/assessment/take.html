<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${assessment.title} + ' | Mentora'">Làm bài test | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/student-sidebar :: studentSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div class="mb-4">
                    <a th:replace="~{components/back-button :: backButton(@{/student/classrooms/{cid}/roadmap(cid=${classroomId})}, 'Trở lại roadmap')}"></a>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between gap-3">
                            <div>
                                <h4 class="fw-bold mb-1" th:text="${assessment.title}"></h4>
                                <p class="text-muted mb-0" th:if="${assessment.description != null}" th:text="${assessment.description}"></p>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-primary" th:text="${assessment.totalScore} + ' điểm'"></span>
                                <span class="badge bg-light text-dark border" th:text="${assessment.durationMinutes} + ' phút'"></span>
                                <!-- Countdown Timer -->
                                <div class="mt-2">
                                    <span class="badge fs-6 px-3 py-2 bg-success text-white" id="timerBadge"
                                          style="min-width: 90px; font-variant-numeric: tabular-nums;">
                                        <i class="ti ti-clock me-1"></i>
                                        <span id="timerDisplay"
                                              th:text="${assessment.durationMinutes} + ':00'">--:--</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="assessmentForm"
                      th:action="@{/student/classrooms/{cid}/assessments/attempts/{aid}/submit(cid=${classroomId},aid=${attempt.id})}"
                      method="post">
                    <div class="card">
                        <div class="card-body">
                            <div th:if="${#lists.isEmpty(questions)}" class="text-center text-muted py-4">
                                Bài test chưa có câu hỏi.
                            </div>

                            <div th:unless="${#lists.isEmpty(questions)}">
                                <div class="border rounded p-3 mb-3" th:each="q, stat : ${questions}">
                                    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                                        <span class="badge bg-light text-dark border" th:text="${'Câu ' + stat.count}"></span>
                                        <span class="badge bg-info text-dark" th:text="${q.difficulty}"></span>
                                        <span class="badge bg-primary" th:text="${q.score} + ' điểm'"></span>
                                    </div>
                                    <div class="fw-semibold mb-3" th:text="${q.content}"></div>

                                    <div class="form-check mb-2"
                                         th:each="opt : ${optionsByQuestionId[q.id]}">
                                        <input class="form-check-input"
                                               type="radio"
                                               th:name="${'answers_' + q.id}"
                                               th:id="${'q' + q.id + '_opt' + opt.id}"
                                               th:value="${opt.id}">
                                        <label class="form-check-label"
                                               th:for="${'q' + q.id + '_opt' + opt.id}"
                                               th:text="${opt.content}"></label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-primary px-4" onclick="confirmSubmit()">
                                        <i class="ti ti-send me-1"></i> Nộp bài
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var secondsRemaining = /*[[${secondsRemaining}]]*/ 0;
        var timerDisplay = document.getElementById('timerDisplay');
        var timerBadge  = document.getElementById('timerBadge');
        var form        = document.getElementById('assessmentForm');
        var autoSubmitted = false;
        var started = false;  // chỉ auto-submit sau khi đồng hồ đã chạy ít nhất 1 tick

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function updateDisplay() {
            var total = Math.max(0, secondsRemaining);
            var h = Math.floor(total / 3600);
            var m = Math.floor((total % 3600) / 60);
            var s = total % 60;
            timerDisplay.textContent = h > 0
                ? pad(h) + ':' + pad(m) + ':' + pad(s)
                : pad(m) + ':' + pad(s);
        }

        function tick() {
            if (started) secondsRemaining--;
            started = true;
            updateDisplay();

            if (secondsRemaining <= 0) {
                timerBadge.className = 'badge fs-6 px-3 py-2 bg-danger text-white';
                if (!autoSubmitted) {
                    autoSubmitted = true;
                    alert('⏰ Hết giờ! Bài làm của bạn sẽ được nộp tự động.');
                    form.submit();
                }
                return;
            }
            // Đổi màu theo thời gian còn lại
            if (secondsRemaining <= 300) {
                timerBadge.className = 'badge fs-6 px-3 py-2 bg-danger text-white';
            } else if (secondsRemaining <= 600) {
                timerBadge.className = 'badge fs-6 px-3 py-2 bg-warning text-dark';
            } else {
                timerBadge.className = 'badge fs-6 px-3 py-2 bg-success text-white';
            }
            setTimeout(tick, 1000);
        }

        // Bắt đầu sau 1 giây để tránh auto-submit ngay khi load
        setTimeout(tick, 1000);
    })();

    function confirmSubmit() {
        if (confirm('Nộp bài test này?')) {
            document.getElementById('assessmentForm').submit();
        }
    }
    /*]]>*/
</script>
</body>
</html>
