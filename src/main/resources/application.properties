spring.application.name=Mentora

# =====================
# SQL SERVER
# =====================
# Local dev falls back to the defaults below; in production set DB_URL/DB_USER/DB_PASSWORD
# as environment variables (e.g. Render env vars pointing at Azure SQL) and never commit real values.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=MentoraDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ====================
# JPA / HIBERNATE
# =====================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================
# THYMELEAF
# =====================
spring.thymeleaf.cache=false

# =====================
# UPLOAD (node contents)
# =====================
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
mentora.upload.node-contents-dir=uploads/node-contents

server.servlet.session.tracking-modes=cookie

# =====================
# SERVER
# =====================
# Render (and most PaaS hosts) inject PORT at runtime; 8080 is the local dev default.
server.port=${PORT:8080}

# Never expose exception details or stack traces on browser error pages.
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
