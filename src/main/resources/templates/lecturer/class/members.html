<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý thành viên | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show py-2">
                    <i class="ti ti-circle-check me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2">
                    <i class="ti ti-circle-x me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Header -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h5 class="fw-semibold mb-1" th:text="${classroom.name}"></h5>
                        <p class="text-muted small mb-0">
                            Mã mời: <code th:text="${classroom.inviteCode}"></code>
                            &nbsp;|&nbsp; Môn: <span th:text="${classroom.subject.code + ' - ' + classroom.subject.name}"></span>
                        </p>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <a th:href="@{/lecturer/classes/{id}/results(id=${classroom.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="ti ti-chart-bar me-1"></i> Kết quả học tập
                        </a>
                        <a th:href="@{/lecturer/classes/{id}/nodes(id=${classroom.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="ti ti-list-check me-1"></i> Hiển thị node
                        </a>
                        <a th:href="@{/lecturer/classes/{id}/qna(id=${classroom.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="ti ti-messages me-1"></i> Hỏi đáp
                        </a>
                        <a th:href="@{/lecturer/classes/{id}/edit(id=${classroom.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="ti ti-edit me-1"></i> Sửa lớp học
                        </a>
                        <a th:replace="~{components/back-button :: backButton(@{/lecturer/classes}, 'Quay lại')}"></a>
                    </div>
                </div>

                <!-- Yêu cầu chờ duyệt -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h6 class="card-title fw-semibold mb-3">
                            <i class="ti ti-clock text-warning me-1"></i>
                            Yêu cầu chờ duyệt
                            <span th:if="${!#lists.isEmpty(pendingMembers)}"
                                  class="badge bg-warning text-dark ms-1"
                                  th:text="${#lists.size(pendingMembers)}"></span>
                        </h6>

                        <div th:if="${#lists.isEmpty(pendingMembers)}" class="text-muted small">
                            Không có yêu cầu nào đang chờ duyệt.
                        </div>

                        <div class="table-responsive" th:unless="${#lists.isEmpty(pendingMembers)}">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Họ tên</th>
                                    <th>Email</th>
                                    <th>Thời gian gửi</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="m, stat : ${pendingMembers}">
                                    <td th:text="${stat.count}"></td>
                                    <td class="fw-semibold" th:text="${m.user.fullName}"></td>
                                    <td th:text="${m.user.email}"></td>
                                    <td th:text="${#temporals.format(m.joinedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td class="text-end">
                                        <div class="table-actions justify-content-end">
                                            <form th:action="@{/lecturer/classes/{cid}/members/{mid}/approve(cid=${classroom.id}, mid=${m.id})}"
                                                  method="post" class="table-action-form">
                                                <button type="submit" class="table-action-btn is-positive"
                                                        title="Chấp nhận thành viên"
                                                        aria-label="Chấp nhận thành viên">
                                                    <i class="ti ti-check"></i>
                                                </button>
                                            </form>
                                            <form th:action="@{/lecturer/classes/{cid}/members/{mid}/reject(cid=${classroom.id}, mid=${m.id})}"
                                                  method="post" class="table-action-form"
                                                  onsubmit="return confirm('Từ chối yêu cầu này?');">
                                                <button type="submit" class="table-action-btn is-danger"
                                                        title="Từ chối thành viên"
                                                        aria-label="Từ chối thành viên">
                                                    <i class="ti ti-x"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Danh sách thành viên đã được duyệt -->
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title fw-semibold mb-3">
                            <i class="ti ti-users text-success me-1"></i>
                            Thành viên lớp
                            <span class="badge bg-success ms-1" th:text="${#lists.size(activeMembers)}"></span>
                        </h6>

                        <div th:if="${#lists.isEmpty(activeMembers)}" class="text-muted small">
                            Chưa có thành viên nào.
                        </div>

                        <div class="table-responsive" th:unless="${#lists.isEmpty(activeMembers)}">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Họ tên</th>
                                    <th>Email</th>
                                    <th>Vai trò</th>
                                    <th>Ngày tham gia</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="m, stat : ${activeMembers}">
                                    <td th:text="${stat.count}"></td>
                                    <td class="fw-semibold" th:text="${m.user.fullName}"></td>
                                    <td th:text="${m.user.email}"></td>
                                    <td>
                                        <span th:if="${m.roleInClass == 'TA'}" class="role-badge">Trợ giảng (TA)</span>
                                        <span th:unless="${m.roleInClass == 'TA'}" class="role-badge">Học sinh</span>
                                    </td>
                                    <td th:text="${#temporals.format(m.joinedAt, 'dd/MM/yyyy')}"></td>
                                    <td class="text-end">
                                        <div class="table-actions justify-content-end">
                                            <form th:if="${m.roleInClass != 'TA'}"
                                                  th:action="@{/lecturer/classes/{cid}/members/{mid}/assign-ta(cid=${classroom.id}, mid=${m.id})}"
                                                  method="post" class="table-action-form">
                                                <button type="submit" class="table-action-btn"
                                                        title="Chỉ định trợ giảng"
                                                        aria-label="Chỉ định trợ giảng">
                                                    <i class="ti ti-star"></i>
                                                </button>
                                            </form>
                                            <form th:if="${m.roleInClass == 'TA'}"
                                                  th:action="@{/lecturer/classes/{cid}/members/{mid}/revoke-ta(cid=${classroom.id}, mid=${m.id})}"
                                                  method="post" class="table-action-form">
                                                <button type="submit" class="table-action-btn"
                                                        title="Thu hồi vai trò trợ giảng"
                                                        aria-label="Thu hồi vai trò trợ giảng">
                                                    <i class="ti ti-star-off"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
