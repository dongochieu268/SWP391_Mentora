<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment: studentSidebar(activePage)
  Usage: <aside th:replace="~{layout/student-sidebar :: studentSidebar(${activePage})}"></aside>
  activePage values: 'dashboard' | 'classrooms'
-->
<aside th:fragment="studentSidebar(activePage)" class="left-sidebar student-navigation">
  <div>
    <div class="brand-logo d-flex align-items-center justify-content-between">
      <a th:href="@{/student/dashboard}" class="text-nowrap logo-img">
        <img th:src="@{/assets/images/logos/logo.svg}" alt="logo"/>
      </a>
      <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse"
           role="button" tabindex="0" aria-label="Đóng menu điều hướng">
        <i class="ti ti-x fs-6" aria-hidden="true"></i>
      </div>
    </div>

    <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
      <ul id="sidebarnav">

        <li class="nav-small-cap">
          <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4" aria-hidden="true"></iconify-icon>
          <span class="hide-menu">Học sinh</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/student/dashboard}"
             th:classappend="${activePage == 'dashboard'} ? ' active'" aria-expanded="false">
            <i class="ti ti-home" aria-hidden="true"></i>
            <span class="hide-menu">Dashboard</span>
          </a>
        </li>

        <li class="nav-small-cap">
          <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4" aria-hidden="true"></iconify-icon>
          <span class="hide-menu">Học tập</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/student/classrooms}"
             th:classappend="${activePage == 'classrooms'} ? ' active'" aria-expanded="false">
            <i class="ti ti-school" aria-hidden="true"></i>
            <span class="hide-menu">Lớp học của tôi</span>
          </a>
        </li>

      </ul>

      <div class="mx-3 mt-4 p-3 rounded-4 text-white"
           style="background: linear-gradient(145deg, #1d4ed8, #4f46e5); box-shadow: 0 14px 28px rgba(37, 99, 235, .2);">
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="ti ti-sparkles fs-5" aria-hidden="true"></i>
          <strong class="small">Mỗi ngày một bước</strong>
        </div>
        <p class="small mb-0" style="color: rgba(255,255,255,.74); line-height: 1.5;">
          Hoàn thành từng bài nhỏ để tiến gần hơn tới mục tiêu.
        </p>
      </div>
    </nav>
  </div>
</aside>

</body>
</html>
