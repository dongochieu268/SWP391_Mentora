<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment: lecturerSidebar(activePage)
  Usage: <aside th:replace="~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}"></aside>
  activePage values: 'dashboard' | 'learning-paths' | 'question-bank' | 'assessments' | 'classes'
-->
<aside th:fragment="lecturerSidebar(activePage)" class="left-sidebar">
  <div>
    <div class="brand-logo d-flex align-items-center justify-content-between">
      <a th:href="@{/lecturer/dashboard}" class="text-nowrap logo-img">
        <img th:src="@{/assets/images/logos/logo.svg}" alt="logo"/>
      </a>
      <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse"
           role="button" tabindex="0" aria-label="Đóng menu điều hướng">
        <i class="ti ti-x fs-6" aria-hidden="true"></i>
      </div>
    </div>

    <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
      <ul id="sidebarnav">

        <li class="nav-small-cap">
          <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4" aria-hidden="true"></iconify-icon>
          <span class="hide-menu">Giảng viên</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/lecturer/dashboard}"
             th:classappend="${activePage == 'dashboard'} ? ' active'" aria-expanded="false">
            <i class="ti ti-home" aria-hidden="true"></i>
            <span class="hide-menu">Dashboard</span>
          </a>
        </li>

        <li class="nav-small-cap">
          <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4" aria-hidden="true"></iconify-icon>
          <span class="hide-menu">Học thuật</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/lecturer/learning-paths}"
             th:classappend="${activePage == 'learning-paths'} ? ' active'" aria-expanded="false">
            <i class="ti ti-route" aria-hidden="true"></i>
            <span class="hide-menu">Lộ trình học</span>
          </a>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/prototype/question-bank.html}"
             th:classappend="${activePage == 'question-bank'} ? ' active'" aria-expanded="false">
            <i class="ti ti-database"></i>
            <span class="hide-menu">Ngân hàng câu hỏi</span>
          </a>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/lecturer/assessments}"
             th:classappend="${activePage == 'assessments'} ? ' active'" aria-expanded="false">
            <i class="ti ti-clipboard-check" aria-hidden="true"></i>
            <span class="hide-menu">Bài test</span>
          </a>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" th:href="@{/lecturer/classes}"
             th:classappend="${activePage == 'classes'} ? ' active'" aria-expanded="false">
            <i class="ti ti-school" aria-hidden="true"></i>
            <span class="hide-menu">Lớp học</span>
          </a>
        </li>

      </ul>
    </nav>
  </div>
</aside>

</body>
</html>
