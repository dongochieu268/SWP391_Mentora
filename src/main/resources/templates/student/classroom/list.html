<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lớp học của tôi | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/student-sidebar :: studentSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Form tham gia lớp bằng mã mời -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title fw-semibold mb-3">Tham gia lớp học</h5>
                        <form th:action="@{/student/classrooms/join}" method="post" class="d-flex gap-2">
                            <input type="text" name="inviteCode" class="form-control"
                                   placeholder="Nhập mã lớp (VD: ABC12345)" maxlength="20"
                                   style="max-width: 280px;" required/>
                            <button type="submit" class="btn btn-primary">
                                <i class="ti ti-door-enter me-1"></i> Tham gia
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Yêu cầu đang chờ duyệt -->
                <div class="card mb-4" th:if="${!#lists.isEmpty(pendingRequests)}">
                    <div class="card-body">
                        <h5 class="card-title fw-semibold mb-3">
                            <i class="ti ti-clock me-1 text-warning"></i> Yêu cầu đang chờ duyệt
                        </h5>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Tên lớp</th>
                                    <th>Môn học</th>
                                    <th>Giảng viên</th>
                                    <th>Học kỳ</th>
                                    <th>Trạng thái</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="m : ${pendingRequests}">
                                    <td class="fw-semibold" th:text="${m.classroom.name}"></td>
                                    <td>
                                        <span class="badge bg-info text-dark" th:text="${m.classroom.subject.code}"></span>
                                        <span th:text="${m.classroom.subject.name}"></span>
                                    </td>
                                    <td th:text="${m.classroom.teacher.fullName}"></td>
                                    <td th:text="${m.classroom.semester.name}"></td>
                                    <td><span class="status-badge status-pending">Chờ duyệt</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Danh sách lớp đã tham gia -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title fw-semibold mb-3">
                            <i class="ti ti-school me-1 text-success"></i> Lớp học của tôi
                        </h5>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" style="min-width: 760px;">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tên lớp</th>
                                    <th>Môn học</th>
                                    <th>Lộ trình</th>
                                    <th>Giảng viên</th>
                                    <th>Học kỳ</th>
                                    <th>Vai trò</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(myClassrooms)}">
                                    <td colspan="8" class="text-center text-muted py-4">
                                        Bạn chưa tham gia lớp học nào. Nhập mã lớp ở trên để tham gia.
                                    </td>
                                </tr>
                                <tr th:each="m, stat : ${myClassrooms}">
                                    <td th:text="${stat.count}"></td>
                                    <td class="fw-semibold" th:text="${m.classroom.name}"></td>
                                    <td>
                                        <span class="badge bg-info text-dark" th:text="${m.classroom.subject.code}"></span>
                                        <span th:text="${m.classroom.subject.name}"></span>
                                    </td>
                                    <td th:text="${m.classroom.learningPath.name}"></td>
                                    <td th:text="${m.classroom.teacher.fullName}"></td>
                                    <td th:text="${m.classroom.semester.name}"></td>
                                    <td>
                                        <span th:if="${m.roleInClass == 'TA'}" class="role-badge">Trợ giảng</span>
                                        <span th:unless="${m.roleInClass == 'TA'}" class="role-badge">Học sinh</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="table-actions justify-content-end">
                                            <a th:href="@{/student/classrooms/{id}/roadmap(id=${m.classroom.id})}"
                                               class="table-action-btn"
                                               title="Xem lộ trình"
                                               aria-label="Xem lộ trình">
                                                <i class="ti ti-route"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
