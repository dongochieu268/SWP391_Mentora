<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Đăng ký | Mentora</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>

<body>

<!-- Body Wrapper -->
<div class="page-wrapper"
     id="main-wrapper"
     data-layout="vertical"
     data-navbarbg="skin6"
     data-sidebartype="full"
     data-sidebar-position="fixed"
     data-header-position="fixed">

    <div class="position-relative overflow-hidden text-bg-light min-vh-100 d-flex align-items-center justify-content-center">
        <div class="d-flex align-items-center justify-content-center w-100">
            <div class="row justify-content-center w-100">
                <div class="col-md-8 col-lg-6 col-xxl-3">
                    <div class="card mb-0">
                        <div class="card-body">
                            <!-- LOGO -->
                            <a th:href="@{/register}" class="text-nowrap logo-img text-center d-block py-3 w-100"><img th:src="@{/assets/images/logos/logo.svg}" alt="logo"></a>
                            <p class="text-center">Tạo tài khoản Mentora</p>
                            <!-- ALERTS -->
                            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
                            <!-- REGISTER FORM -->
                            <form th:action="@{/register}" method="post">
                                <!-- FULL NAME -->
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Họ và tên</label>
                                    <input type="text"
                                           class="form-control"
                                           id="fullName"
                                           name="fullName"
                                           placeholder="Nhập họ và tên của bạn"
                                           th:value="${fullName}"
                                           required>
                                </div>
                                <!-- EMAIL -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           name="email"
                                           placeholder="Nhập email của bạn"
                                           th:value="${email}"
                                           required>
                                </div>
                                <!-- PASSWORD -->
                                <div class="mb-4">
                                    <label for="password" class="form-label">Mật khẩu</label>
                                    <input type="password"
                                           class="form-control"
                                           id="password"
                                           name="password"
                                           placeholder="Nhập mật khẩu"
                                           required>
                                </div>
                                <!-- REGISTER BUTTON -->
                                <button type="submit" class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2">Đăng ký</button>
                                <!-- LOGIN -->
                                <div class="d-flex align-items-center justify-content-center">
                                    <p class="fs-4 mb-0 fw-bold">Đã có tài khoản?</p>
                                    <a class="text-primary fw-bold ms-2" th:href="@{/login}">Đăng nhập</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script th:src="@{/assets/libs/jquery/dist/jquery.min.js}"></script>

<script th:src="@{/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

<!-- Solar Icons -->
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>

</body>
</html>
