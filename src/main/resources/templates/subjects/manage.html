<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Mentora'">Quản lý môn học | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="${sidebarType == 'lecturer'}
           ? ~{layout/lecturer-sidebar :: lecturerSidebar(${activePage})}
           : ~{layout/admin-sidebar :: adminSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${successMessage}" class="alert alert-success py-2" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <div>
                                <h4 class="card-title mb-1" th:text="${pageTitle}">Quản lý môn học</h4>
                            </div>
                            <a th:href="${baseUrl + '?create=true'}" class="btn btn-primary">
                                <i class="ti ti-plus me-1"></i> Thêm môn học
                            </a>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Môn học</th>
                                    <th class="d-none d-md-table-cell">Mô tả</th>
                                    <th>Trạng thái</th>
                                    <th class="d-none d-lg-table-cell">Ngày tạo</th>
                                    <th style="width: 60px;"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <th:block th:if="${#lists.isEmpty(subjects)}">
                                    <tr th:replace="~{components/empty-state :: emptyRow('Chưa có môn học nào.', 5)}"></tr>
                                </th:block>
                                <tr th:each="s : ${subjects}">
                                    <td>
                                        <div class="fw-semibold" th:text="${s.code}"></div>
                                        <div class="text-muted small" th:text="${s.name}"></div>
                                    </td>
                                    <td class="d-none d-md-table-cell">
                                        <span class="text-muted small"
                                              th:if="${s.description == null or #strings.isEmpty(s.description)}">—</span>
                                        <span class="text-muted small"
                                              th:unless="${s.description == null or #strings.isEmpty(s.description)}"
                                              th:text="${#strings.length(s.description) > 60 ? #strings.substring(s.description, 0, 60) + '...' : s.description}"
                                              th:title="${s.description}"></span>
                                    </td>
                                    <td>
                                        <th:block th:replace="~{components/status-badge :: statusBadge(${s.status})}"></th:block>
                                    </td>
                                    <td class="d-none d-lg-table-cell text-muted small"
                                        th:text="${s.createdAt != null ? #temporals.format(s.createdAt, 'dd/MM/yyyy') : '—'}"></td>
                                    <td>
                                        <div class="dropdown">
                                            <button class="table-action-btn" type="button"
                                                    data-bs-toggle="dropdown" aria-expanded="false">
                                                <i class="ti ti-dots-vertical"></i>
                                            </button>
                                            <ul class="dropdown-menu dropdown-menu-end">
                                                <li>
                                                    <a class="dropdown-item" th:href="${baseUrl + '?editId=' + s.id}">
                                                        <i class="ti ti-edit me-2"></i> Sửa môn học
                                                    </a>
                                                </li>
                                                <li>
                                                    <a class="dropdown-item" th:href="${baseUrl + '/' + s.id + '/prerequisites'}">
                                                        <i class="ti ti-link me-2"></i> Môn tiên quyết
                                                    </a>
                                                </li>
                                                <li><hr class="dropdown-divider"></li>
                                                <li th:if="${s.status == 'ACTIVE'}">
                                                    <form th:action="${baseUrl + '/unpublish/' + s.id}" method="post">
                                                        <button type="submit" class="dropdown-item text-warning">
                                                            <i class="ti ti-eye-off me-2"></i> Ẩn môn học
                                                        </button>
                                                    </form>
                                                </li>
                                                <li th:unless="${s.status == 'ACTIVE'}">
                                                    <form th:action="${baseUrl + '/publish/' + s.id}" method="post">
                                                        <button type="submit" class="dropdown-item text-success">
                                                            <i class="ti ti-eye me-2"></i> Hiển thị
                                                        </button>
                                                    </form>
                                                </li>
                                                <li>
                                                    <form th:action="${baseUrl + '/delete/' + s.id}" method="post"
                                                          onsubmit="return confirm('Xóa môn học này?');">
                                                        <button type="submit" class="dropdown-item text-danger">
                                                            <i class="ti ti-trash me-2"></i> Xóa môn học
                                                        </button>
                                                    </form>
                                                </li>
                                            </ul>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="subjectModal" tabindex="-1"
     th:classappend="${openModal} ? ' show' : ''"
     th:style="${openModal} ? 'display: block;' : ''"
     aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="${baseUrl + '/save'}" th:object="${subjectForm}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${subjectForm.id != null} ? 'Sửa môn học' : 'Thêm môn học'">Thêm môn học</h5>
                    <a th:href="${baseUrl}" class="btn-close" aria-label="Close"></a>
                </div>
                <div class="modal-body">
                    <input type="hidden" th:field="*{id}"/>
                    <div class="mb-3">
                        <label for="code" class="form-label">Mã môn <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="code" th:field="*{code}" maxlength="20" required>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Tên môn <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" maxlength="200" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Mô tả</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3" maxlength="2000"></textarea>
                    </div>
                    <div class="mb-0">
                        <label for="status" class="form-label">Trạng thái</label>
                        <select class="form-select" id="status" th:field="*{status}">
                            <option value="ACTIVE">ACTIVE (Đã xuất bản)</option>
                            <option value="HIDDEN">HIDDEN (Ẩn)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <a th:href="${baseUrl}" class="btn btn-light">Hủy</a>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:if="${openModal}" class="modal-backdrop fade show"></div>

<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
</body>
</html>
