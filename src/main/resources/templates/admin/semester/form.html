<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? 'Sửa học kỳ | Mentora' : 'Thêm học kỳ | Mentora'">Forms | Mentora</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logos/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
</head>

<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
     data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{layout/admin-sidebar :: adminSidebar(${activePage})}"></aside>

    <div class="body-wrapper">
        <header th:replace="~{layout/admin-header :: adminHeader(${user})}"></header>
        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show py-2">
                    <i class="ti ti-circle-check me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2">
                    <i class="ti ti-circle-x me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <h5 class="card-title fw-semibold mb-0"
                                th:text="${isEdit} ? 'Cập nhật học kỳ' : 'Thêm học kỳ mới'"></h5>
                            <a class="btn btn-light border" th:href="@{/admin/semesters}">
                                <i class="ti ti-arrow-left me-1"></i> Quay lại
                            </a>
                        </div>

                        <div class="row justify-content-center">
                            <div class="col-lg-6 col-md-8">
                                <form method="post"
                                      th:action="${isEdit} ? @{/admin/semesters/{id}(id=${semester.id})} : @{/admin/semesters}">

                                    <!-- Tên học kỳ -->
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Tên học kỳ <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name" name="name"
                                               th:value="${semester.name}" maxlength="100" required
                                               placeholder="VD: Học kỳ 1 2025-2026">
                                    </div>

                                    <!-- Ngày bắt đầu + Ngày kết thúc -->
                                    <div class="row g-3 mb-3">
                                        <div class="col-6">
                                            <label for="startDate" class="form-label">Ngày bắt đầu <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control flatpickr-date"
                                                   id="startDate" name="startDate"
                                                   th:value="${semester.startDate}"
                                                   placeholder="dd/mm/yyyy" required autocomplete="off">
                                        </div>
                                        <div class="col-6">
                                            <label for="endDate" class="form-label">Ngày kết thúc <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control flatpickr-date"
                                                   id="endDate" name="endDate"
                                                   th:value="${semester.endDate}"
                                                   placeholder="dd/mm/yyyy" required autocomplete="off">
                                        </div>
                                    </div>

                                    <!-- Trạng thái -->
                                    <div class="mb-4">
                                        <label for="status" class="form-label">Trạng thái</label>
                                        <select class="form-select" id="status" name="status">
                                            <option value="ACTIVE" th:selected="${semester.status == 'ACTIVE'}">Hoạt động (ACTIVE)</option>
                                            <option value="HIDDEN" th:selected="${semester.status == 'HIDDEN'}">Ẩn (HIDDEN)</option>
                                        </select>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary"
                                                th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo học kỳ'"></button>
                                        <a th:href="@{/admin/semesters}" class="btn btn-light border">Hủy</a>
                                    </div>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/admin-scripts :: adminScripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
<script>
    // Hai date picker riêng biệt — hiển thị dd/mm/yyyy, gửi server dạng ISO yyyy-mm-dd
    var startPicker = flatpickr('#startDate', {
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'd/m/Y',
        locale: 'vn',
        allowInput: true,
        onChange: function (dates) {
            // Ngày kết thúc không được trước ngày bắt đầu
            if (dates.length) endPicker.set('minDate', dates[0]);
        }
    });
    var endPicker = flatpickr('#endDate', {
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'd/m/Y',
        locale: 'vn',
        allowInput: true
    });
</script>
</body>

</html>
